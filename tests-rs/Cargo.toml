[package]
name = "vault-raydium-tests"
version = "0.1.0"
edition = "2021"
publish = false
description = "Integration tests: Liquidity Vault swaps through the REAL Raydium CLMM program and REAL devnet pool state (solana-program-test)"

# standalone: not part of the program workspace (keeps the SBF lockfile small)
[workspace]

[dependencies]

[dev-dependencies]
liquidity_vault = { path = "../programs/liquidity_vault", features = ["no-entrypoint"] }
anchor-lang = "0.30.1"
solana-program-test = "~1.18.26"
solana-sdk = "~1.18.26"
spl-token = { version = "4.0", features = ["no-entrypoint"] }
spl-associated-token-account = { version = "3.0", features = ["no-entrypoint"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
base64 = "0.21"
